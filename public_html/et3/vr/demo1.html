<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
<a-scene keyboard-shortcuts="" screenshot="" xr-mode-ui="" device-orientation-permission-ui="">
                      <a-box position="-1 1.6 -5" animation="property: position; to: 1 8 -10; dur: 2000; easing: linear; loop: true" color="#97d3dd"></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E" material="color: #f787a3"></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D" material="blending: none; color: #ffd68a" animation=""></a-cylinder>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4" material="color: #a9d6c1"></a-plane>
      <a-assets>
  <img id="texture" src="img/GRASSS.webp">
</a-assets>

<a-cone src="#texture" radius-bottom="2" radius-top="0.5"></a-cone>

<!-- Textured box. -->
<a-cone src="#texture"></a-cone>
      <a-scene>
  <a-assets>
    <img id="sky" src="img/sky.jpg">
  </a-assets>
  <a-sky src="#sky"></a-sky>
</a-scene>
    </a-scene>
  </body>
</html>
